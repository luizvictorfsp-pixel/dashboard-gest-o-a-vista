<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão a Vista — Dashboard BI · DNA Facilities</title>
<meta name="description" content="Dashboard de Business Intelligence da plataforma Gestão a Vista — DNA Facilities. Indicadores de RH, SMA, Orçamento e Medição vinculados ao Google Sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS & RESET
   ══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a14;--bg-body:#0a0f1e;--bg-surface:#0f1629;--bg-card:#111a2e;
  --bg-card-hover:#162040;--bg-glass:rgba(15,22,41,.72);
  --border:#1a2744;--border-glow:rgba(56,189,248,.18);
  --text:#f0f4fc;--text-sub:#8b9cc0;--text-dim:#5a6a8a;
  --accent:#38bdf8;--accent-glow:rgba(56,189,248,.25);--accent-deep:#0c4a6e;
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,.12);
  --teal:#2dd4bf;--teal-bg:rgba(45,212,191,.12);
  --pink:#f472b6;--pink-bg:rgba(244,114,182,.12);
  --orange:#f97316;--orange-bg:rgba(249,115,22,.12);
  --r:14px;--r-sm:10px;--r-xs:6px;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --fast:.15s cubic-bezier(.4,0,.2,1);--base:.25s cubic-bezier(.4,0,.2,1);
}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg-body);color:var(--text);
  line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%,rgba(56,189,248,.06),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(167,139,250,.05),transparent);
}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ══════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════ */
.app{display:flex;min-height:100vh}

/* ── SIDEBAR ─────────────────────────────────── */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:260px;
  background:var(--bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:100;
  transition:transform var(--base);
}
.sb-head{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.sb-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb-logo{
  width:36px;height:36px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--accent),#6366f1);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;font-weight:900;color:#fff;flex-shrink:0;
  box-shadow:0 4px 16px rgba(56,189,248,.3);
}
.sb-title{font-size:.92rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.sb-sub{font-size:.65rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* Config panel */
.sb-config{padding:14px 18px;border-bottom:1px solid var(--border)}
.sb-config label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:700;display:block;margin-bottom:5px}
.sb-config input{
  width:100%;padding:8px 10px;background:var(--bg-surface);
  border:1px solid var(--border);border-radius:var(--r-xs);
  color:var(--text);font-size:.78rem;font-family:var(--mono);
  outline:none;transition:border-color var(--fast);
}
.sb-config input:focus{border-color:var(--accent)}
.sb-config .btn-load{
  width:100%;margin-top:8px;padding:8px;background:linear-gradient(135deg,var(--accent),#6366f1);
  border:none;border-radius:var(--r-xs);color:#fff;font-size:.78rem;
  font-weight:700;cursor:pointer;font-family:var(--font);
  transition:opacity var(--fast);
}
.sb-config .btn-load:hover{opacity:.88}
.sb-config .btn-load:disabled{opacity:.4;cursor:not-allowed}
.config-status{font-size:.68rem;margin-top:6px;padding:4px 8px;border-radius:var(--r-xs);display:none}
.config-status.ok{display:block;background:var(--green-bg);color:var(--green)}
.config-status.err{display:block;background:var(--red-bg);color:var(--red)}
.config-status.loading{display:block;background:var(--amber-bg);color:var(--amber)}

/* Navigation */
.sb-nav{flex:1;overflow-y:auto;padding:10px}
.sb-nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:var(--r-xs);
  font-size:.82rem;color:var(--text-sub);cursor:pointer;
  transition:all var(--fast);position:relative;
}
.sb-nav-item:hover{background:var(--bg-card);color:var(--text)}
.sb-nav-item.active{background:var(--accent-deep);color:var(--accent);font-weight:600}
.sb-nav-item.active::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;
  width:3px;border-radius:3px;background:var(--accent);
}
.sb-nav-item .nav-icon{font-size:.9rem}
.sb-footer{padding:12px 18px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text-dim)}
.sb-footer .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);box-shadow:0 0 6px var(--green);
  margin-right:4px;animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Mobile toggle */
.mobile-btn{
  display:none;position:fixed;top:12px;left:12px;z-index:200;
  width:38px;height:38px;border-radius:var(--r-sm);background:var(--bg-card);
  border:1px solid var(--border);color:var(--text);font-size:1.1rem;
  cursor:pointer;align-items:center;justify-content:center;
}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;backdrop-filter:blur(4px)}
.overlay.show{display:block}

/* ── MAIN CONTENT ────────────────────────────── */
.main{margin-left:260px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.top-bar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;height:56px;
  background:rgba(10,15,30,.85);backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
.top-bar .crumbs{font-size:.8rem;color:var(--text-dim)}
.top-bar .crumbs b{color:var(--text-sub)}
.top-bar .badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:.72rem;font-weight:600;
  background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,.2);
}
.content{padding:24px 28px 60px;flex:1}

/* ── FADE IN ─────────────────────────────────── */
.fade{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── HERO ────────────────────────────────────── */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(56,189,248,.08),rgba(99,102,241,.06));
  border:1px solid var(--border-glow);border-radius:20px;
  padding:32px 36px;margin-bottom:28px;
}
.hero::before{
  content:'';position:absolute;top:-60%;right:-20%;width:400px;height:400px;
  border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.08),transparent 70%);
  pointer-events:none;
}
.hero h1{
  font-size:1.8rem;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.hero p{color:var(--text-sub);font-size:.92rem;max-width:620px}
.hero-tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:600;
  background:var(--bg-glass);border:1px solid var(--border);color:var(--text-sub);
}

/* ── STATS ROW ───────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 20px;position:relative;overflow:hidden;
  transition:all var(--base);
}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;opacity:0;transition:opacity var(--fast)}
.stat:hover{border-color:var(--border-glow);transform:translateY(-2px)}
.stat:hover::after{opacity:1}
.stat:nth-child(1)::after{background:linear-gradient(90deg,var(--accent),#6366f1)}
.stat:nth-child(2)::after{background:linear-gradient(90deg,var(--green),var(--teal))}
.stat:nth-child(3)::after{background:linear-gradient(90deg,var(--amber),var(--orange))}
.stat:nth-child(4)::after{background:linear-gradient(90deg,var(--purple),var(--pink))}
.stat:nth-child(5)::after{background:linear-gradient(90deg,var(--teal),var(--green))}
.stat:nth-child(6)::after{background:linear-gradient(90deg,var(--pink),var(--purple))}
.stat .label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
.stat .val{font-size:1.6rem;font-weight:800;color:#fff;font-family:var(--mono);letter-spacing:-.02em}
.stat .desc{font-size:.72rem;color:var(--text-sub);margin-top:3px}
.stat .trend{font-size:.72rem;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend.neutral{color:var(--amber)}

/* ── SECTION TITLE ───────────────────────────── */
.sec-title{
  font-size:1rem;font-weight:700;color:#fff;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.sec-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ── CHART CARDS ─────────────────────────────── */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:28px}
.chart-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;transition:border-color var(--base);
}
.chart-card:hover{border-color:var(--border-glow)}
.chart-card h3{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.chart-card .chart-sub{font-size:.72rem;color:var(--text-dim);margin-bottom:14px}
.chart-wrap{position:relative;height:260px}
.chart-wrap canvas{width:100%!important;height:100%!important}

/* ── KPI CARDS ───────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:28px}
.kpi{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;transition:all var(--base);
}
.kpi:hover{border-color:var(--border-glow);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kpi-code{font-family:var(--mono);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:var(--r-xs)}
.kpi-mod{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi-name{font-size:.85rem;font-weight:600;color:#fff;margin-bottom:4px}
.kpi-val{font-size:1.4rem;font-weight:800;font-family:var(--mono);letter-spacing:-.02em;margin-bottom:4px}
.kpi-meta{font-size:.7rem;color:var(--text-dim)}
.kpi-bar{height:4px;border-radius:2px;background:var(--bg-surface);margin-top:8px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.kpi .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* ── TABLE ───────────────────────────────────── */
.table-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:28px;overflow-x:auto;
}
.table-card h3{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{padding:10px 12px;text-align:left;font-size:.7rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-sub);transition:background var(--fast)}
tr:hover td{background:var(--bg-surface)}
.badge-ok{color:var(--green);background:var(--green-bg);padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700}
.badge-warn{color:var(--amber);background:var(--amber-bg);padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700}
.badge-crit{color:var(--red);background:var(--red-bg);padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700}
.mono{font-family:var(--mono);font-weight:600}

/* ── EMPTY / LOADING ─────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;color:var(--text-dim)}
.empty .icon{font-size:3rem;margin-bottom:14px;opacity:.4}
.empty p{font-size:.88rem;max-width:420px}
.spinner-wrap{display:flex;align-items:center;justify-content:center;min-height:200px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── REFRESH BTN ─────────────────────────────── */
.refresh-btn{
  position:fixed;bottom:24px;right:24px;z-index:80;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#6366f1);
  border:none;color:#fff;font-size:1.2rem;cursor:pointer;
  box-shadow:0 6px 24px rgba(56,189,248,.4);
  transition:transform var(--fast),box-shadow var(--fast);
}
.refresh-btn:hover{transform:scale(1.1);box-shadow:0 8px 32px rgba(56,189,248,.5)}
.refresh-btn.loading{animation:spin 1s linear infinite}

/* ── RESPONSIVE ──────────────────────────────── */
@media(max-width:920px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .mobile-btn{display:flex}.main{margin-left:0}
  .top-bar{padding:0 14px 0 56px}.content{padding:18px 14px 60px}
  .hero{padding:22px}.hero h1{font-size:1.4rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
}
@media(max-width:540px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>

<button class="mobile-btn" onclick="toggleSB()" aria-label="Menu">☰</button>
<div class="overlay" id="overlay" onclick="toggleSB()"></div>

<div class="app">
  <!-- ═══ SIDEBAR ════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-brand">
        <div class="sb-logo">GV</div>
        <div><div class="sb-title">Gestão a Vista</div><div class="sb-sub">DNA Facilities · BI</div></div>
      </div>
    </div>

    <div class="sb-config">
      <label>📂 Carregar Planilha Excel (.xlsx)</label>
      <input type="file" id="fileUploadInput" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(this)" style="display:none">
      <button class="btn-load" style="background:linear-gradient(135deg,#059669,#10b981);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px" onclick="document.getElementById('fileUploadInput').click()">
        <span>📁</span> Selecionar Arquivo .xlsx
      </button>
      <div id="fileUploadStatus" style="font-size:.68rem;color:var(--text-sub);min-height:14px;margin-bottom:8px"></div>

      <div style="border-top:1px solid var(--border);padding-top:8px">
        <label>🔗 Google Sheets ID / Link</label>
        <input type="text" id="sheetId" placeholder="Cole o ID da planilha..." value="">
        <button class="btn-load" id="btnLoad" onclick="loadFromSheets()">📡 Carregar Google Sheets</button>
        <div class="config-status" id="configStatus"></div>
        <button onclick="resetToDemo()" style="margin-top:8px;width:100%;padding:5px 8px;font-size:.68rem;background:rgba(255,255,255,0.04);border:1px dashed var(--border);border-radius:var(--r-xs);color:var(--text-sub);cursor:pointer" title="Limpa o cache e restaura dados de demonstração">🔄 Limpar Cache / Resetar</button>
      </div>
    </div>

    <nav class="sb-nav" id="nav"></nav>

    <div class="sb-footer">
      <span class="dot"></span> Última atualização: <span id="lastUpdate">—</span>
    </div>
  </aside>

  <!-- ═══ MAIN ═══════════════════════════════ -->
  <main class="main">
    <header class="top-bar">
      <div class="crumbs">📊 Dashboard / <b id="pageTitle">Cockpit Executivo</b></div>
      <span class="badge" id="dataBadge"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 6px var(--green)"></span> Dados Demo</span>
    </header>
    <div class="content" id="content">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<button class="refresh-btn" id="refreshBtn" onclick="loadFromSheets()" title="Atualizar dados">🔄</button>

function parseCellNumber(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  if (typeof v === 'boolean') return 0;
  const str = String(v).trim();
  if (str === '') return 0;

  let cleaned = str.replace(/[R$%\s\u00a0]/g, '');
  // Trata "R$ -", "-" e "R$-" como zero (padrão de célula vazia no Google Sheets)
  if (cleaned === '-' || cleaned === '') return 0;

  // Formato BR com separador de milhar (ponto) E decimal (vírgula): ex "21.600,00" ou "1.234.567,89"
  if (/^-?\d{1,3}(\.\d{3})+,\d+$/.test(cleaned)) {
    cleaned = cleaned.replace(/\./g, '').replace(',', '.');
  // Formato BR com separador de milhar (ponto) SEM decimal: ex "21.600" ou "1.234.567"
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(cleaned)) {
    cleaned = cleaned.replace(/\./g, '');
  // Formato com vírgula decimal: ex "21,6" → troca vírgula por ponto
  } else {
    cleaned = cleaned.replace(',', '.');
  }

  // Tenta extrair número com sufixo h ou horas (ex: '432 h')
  const hMatch = str.match(/^(-?\d+(?:[.,]\d+)?)\s*(?:h|horas?)?$/i);
  if (hMatch && /h/i.test(str)) {
    const n = Number(hMatch[1].replace(',', '.'));
    if (!isNaN(n)) return n;
  }

  const n = Number(cleaned);
  return isNaN(n) ? 0 : n;
}

function parseCell(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  if (typeof v === 'boolean') return v;
  const str = String(v).trim();
  if (str === '') return '';

  let cleaned = str.replace(/[R$%\s\u00a0]/g, '');
  // Trata "R$ -", "-" e "R$-" como zero (padrão de célula vazia/zerada no Google Sheets)
  if (cleaned === '-') return 0;
  if (cleaned === '') return 0;

  // Formato BR com separador de milhar (ponto) E decimal (vírgula): ex "21.600,00" ou "R$ 180.000,00"
  if (/^-?\d{1,3}(\.\d{3})+,\d+$/.test(cleaned)) {
    cleaned = cleaned.replace(/\./g, '').replace(',', '.');
  // Formato BR com separador de milhar (ponto) SEM decimal: ex "21.600" ou "23.400"
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(cleaned)) {
    cleaned = cleaned.replace(/\./g, '');
  // Formato com vírgula decimal simples: ex "1,5"
  } else {
    cleaned = cleaned.replace(',', '.');
  }

  // Apenas se for estritamente um formato numérico válido:
  if (/^-?\d+(\.\d+)?$/.test(cleaned)) {
    const n = Number(cleaned);
    if (!isNaN(n)) return n;
  }

  // Se tiver sufixo 'h' ou 'horas' (ex: '432 h')
  const hMatch = str.match(/^(-?\d+(?:[.,]\d+)?)\s*(?:h|horas?)$/i);
  if (hMatch) {
    const n = Number(hMatch[1].replace(',', '.'));
    if (!isNaN(n)) return n;
  }

  // Preserva o texto puro (ex: 'Jan/26', 'CT-2024-HOSP', 'recebido')
  return str;
}

// GOOGLE SHEETS LOADER (Dual-Mode: Fetch CSV + JSONP Fallback)
// ══════════════════════════════════════════════
function fetchSheetJSONP(sheetId, tabName) {
  return new Promise((resolve, reject) => {
    const cbName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
    const script = document.createElement('script');
    let isDone = false;

    const timer = setTimeout(() => {
      if (!isDone) {
        cleanup();
        reject(new Error(`Timeout na aba "${tabName}". Verifique se o compartilhamento da planilha está como "Qualquer pessoa com o link".`));
      }
    }, 12000);

    function cleanup() {
      isDone = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch(e) {}
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(resp) {
      cleanup();
      try {
        if (!resp) throw new Error(`Sem resposta para a aba "${tabName}"`);
        if (resp.status === 'error') {
          const errMsg = resp.errors && resp.errors[0] ? (resp.errors[0].detailed_message || resp.errors[0].message) : 'Erro de permissão ou aba inexistente';
          throw new Error(`Aba "${tabName}": ${errMsg}`);
        }
        if (!resp.table) throw new Error(`Tabela vazia na aba "${tabName}"`);

        const cols = (resp.table.cols || []).map(c => (c.label || '').trim());
        const rows = resp.table.rows || [];
        
        let headers = cols;
        let startRow = 0;
        const allColsBlank = cols.every(c => !c);
        if (allColsBlank && rows.length > 0) {
          headers = rows[0].c.map(cell => cell && cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '');
          startRow = 1;
        }

        const normalizedHeaders = headers.map(normalizeHeader);
        const result = [];

        for (let i = startRow; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r.c) continue;
          const obj = {};
          let hasVal = false;
          normalizedHeaders.forEach((h, colIdx) => {
            if (!h) return;
            const cell = r.c[colIdx];
            let v = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : '';
            if (v !== '') hasVal = true;
            obj[h] = parseCell(v);
          });
          if (hasVal) {
            result.push(obj);
          }
        }
        resolve(result);
      } catch (err) {
        reject(err);
      }
    };

    script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(tabName)}&tqx=responseHandler:${cbName}&headers=1`;
    script.onerror = function() {
      cleanup();
      reject(new Error(`Falha de conexão na aba "${tabName}". Certifique-se de que a planilha está compartilhada como "Qualquer pessoa com o link".`));
    };
    document.head.appendChild(script);
  });
}

async function fetchSheet(sheetId, tabName) {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    const rows = parseCSV(text);
    if (rows && rows.length) return rows;
    return await fetchSheetJSONP(sheetId, tabName);
  } catch (err) {
    // Fallback automático para JSONP (funciona sem restrições de CORS e protocolo file://)
    return await fetchSheetJSONP(sheetId, tabName);
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]).map(normalizeHeader);
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => {
      let v = (vals[i] || '').trim();
      obj[h] = parseCell(v);
    });
    return obj;
  });
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

async function loadFromSheets() {
  let id = document.getElementById('sheetId').value.trim();
  // Se contiver /d/<id> ou ID direto de 20+ caracteres
  const match = id.match(/\/d\/([a-zA-Z0-9-_]+)/) || id.match(/([a-zA-Z0-9-_]{20,})/);
  if (match) {
    id = match[1];
  }
  const status = document.getElementById('configStatus');
  const btn = document.getElementById('btnLoad');
  const refreshBtn = document.getElementById('refreshBtn');

  btn.disabled = true;
  refreshBtn.classList.add('loading');
  status.className = 'config-status loading';
  status.textContent = '⏳ Carregando dados...';

  if (!id) {
    // Use demo data
    DATA = JSON.parse(JSON.stringify(DEMO));
    isSheetConnected = false;
    document.getElementById('dataBadge').innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;box-shadow:0 0 6px var(--amber)"></span> Dados Demo';
    status.className = 'config-status ok';
    status.textContent = '✅ Dados de demonstração carregados';
    document.getElementById('lastUpdate').textContent = new Date().toLocaleString('pt-BR');
    btn.disabled = false;
    refreshBtn.classList.remove('loading');
    destroyCharts();
    render();
    return;
  }

  try {
    const tabs = ['RH', 'SMA', 'Orcamento', 'Medicao'];
    const [rh, sma, orc, med] = await Promise.all(tabs.map(t => fetchSheet(id, t)));

    DATA.rh = rh;
    DATA.sma = sma;
    DATA.orcamento = orc;
    DATA.medicao = med;
    isSheetConnected = true;

    document.getElementById('dataBadge').innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 6px var(--green)"></span> Google Sheets';
    status.className = 'config-status ok';
    status.textContent = `✅ ${rh.length + sma.length + orc.length + med.length} registros carregados`;
    document.getElementById('lastUpdate').textContent = new Date().toLocaleString('pt-BR');
    localStorage.setItem('gv_sheet_id', id);
    localStorage.removeItem('gv_custom_data');
    localStorage.removeItem('gv_custom_filename');

    destroyCharts();
    render();
  } catch (e) {
    status.className = 'config-status err';
    let msg = e.message || 'Falha ao conectar';
    if (msg.includes('Failed to fetch') || msg.includes('Falha de conexão')) {
      msg = 'Não foi possível ler a planilha. Certifique-se de que o acesso está como "Qualquer pessoa com o link" (Leitor) no Google Sheets.';
    }
    status.textContent = `❌ Erro: ${msg}`;
    console.error(e);
  }

  btn.disabled = false;
  refreshBtn.classList.remove('loading');
}

// INDICATOR CALCULATIONS (matching catalogo-indicadores.md)
// ══════════════════════════════════════════════
function calcIndicators() {
  const kpis = {};
  const rh = DATA.rh;
  const sma = DATA.sma;
  const orc = DATA.orcamento;
  const med = DATA.medicao;

  // ── RH ──
  // Usa os getters robustos para suportar qualquer variação de nome de coluna da planilha
  if (rh.length) {
    const last = rh[rh.length - 1];
    const contratual = getRhContratual(last);
    const realizado  = getRhRealizado(last);
    kpis['IND-001'] = contratual > 0 ? (realizado / contratual) * 100 : 0;

    // Turnover — usa getter no período anterior também
    const prev   = rh.length > 1 ? rh[rh.length - 2] : last;
    const efIni  = getRhRealizado(prev);
    const efFim  = realizado;
    const hcMedio = (efIni + efFim) / 2;
    const lastAdm  = getRhAdm(last);
    const lastDesl = getRhDesl(last);
    kpis['IND-002'] = hcMedio > 0 ? (((lastAdm + lastDesl) / 2) / hcMedio) * 100 : 0;

    // Absenteísmo
    const lastPrev = getRhPrev(last);
    const lastAus  = getRhAus(last);
    kpis['IND-003'] = lastPrev > 0 ? (lastAus / lastPrev) * 100 : 0;
  }

  // ── SMA ──
  if (sma.length) {
    const last = sma[sma.length - 1];
    kpis['IND-004'] = last.HHT || 0;
    kpis['IND-005'] = last.HHT > 0 ? (last.ACIDENTES_COM_AFASTAMENTO * 1000000) / last.HHT : 0;
    kpis['IND-006'] = last.HHT > 0 ? (last.ACIDENTES_SEM_AFASTAMENTO * 1000000) / last.HHT : 0;
    kpis['IND-007'] = last.INSPECOES_PLANEJADAS > 0 ? (last.INSPECOES_REALIZADAS / last.INSPECOES_PLANEJADAS) * 100 : 0;
  }

  // ── Orçamento ──
  if (orc.length) {
    const totalOrc = orc.reduce((s, r) => s + (r.ORCADO || 0), 0);
    const totalReal = orc.reduce((s, r) => s + (r.REALIZADO || 0), 0);
    kpis['IND-008'] = totalReal - totalOrc;
    kpis['IND-009'] = totalOrc > 0 ? (totalReal / totalOrc) * 100 : 0;
    kpis['IND-010'] = totalOrc - totalReal;
  }

  // ── Medição ──
  if (med.length) {
    const totalMedido = med.reduce((s, r) => s + (r.VALOR_MEDIDO || 0), 0);
    const totalAprovado = med.reduce((s, r) => s + (r.VALOR_APROVADO || 0), 0);
    const totalGlosas = med.reduce((s, r) => s + (r.VALOR_GLOSAS || 0), 0);
    kpis['IND-011'] = totalAprovado;
    kpis['IND-012'] = totalMedido > 0 ? (totalGlosas / totalMedido) * 100 : 0;
    // Lead time approx
    kpis['IND-013'] = 8; // placeholder
  }

  return kpis;
}

function getStatus(code, val) {
  const rules = {
    'IND-001': v => v >= 98 ? 'ok' : v >= 95 ? 'warn' : 'crit',
    'IND-002': v => v <= 2.5 ? 'ok' : v <= 4 ? 'warn' : 'crit',
    'IND-003': v => v <= 3 ? 'ok' : v <= 5 ? 'warn' : 'crit',
    'IND-005': v => v === 0 ? 'ok' : 'crit',
    'IND-006': v => v <= 1 ? 'ok' : v <= 2.5 ? 'warn' : 'crit',
    'IND-007': v => v >= 95 ? 'ok' : v >= 85 ? 'warn' : 'crit',
    'IND-008': v => v <= 0 ? 'ok' : v <= 5000 ? 'warn' : 'crit',
    'IND-009': v => v <= 100 ? 'ok' : v <= 105 ? 'warn' : 'crit',
    'IND-010': v => v >= 0 ? 'ok' : 'crit',
    'IND-012': v => v <= 0.5 ? 'ok' : v <= 2 ? 'warn' : 'crit',
    'IND-013': v => v <= 15 ? 'ok' : 'crit',
  };
  return (rules[code] || (() => 'ok'))(val);
}

function statusColor(s) { return s === 'ok' ? 'var(--green)' : s === 'warn' ? 'var(--amber)' : 'var(--red)'; }
function statusBg(s) { return s === 'ok' ? 'var(--green-bg)' : s === 'warn' ? 'var(--amber-bg)' : 'var(--red-bg)'; }
function fmtNum(v, dec=1) { return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtMoney(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

// ACCESS INTEGRATION (RBAC)

function checkAccess(page) {
  const flags = JSON.parse(localStorage.getItem('gv_flags') || '{}');
  if (!flags[page] && !flags[page] === undefined) {
    // Default: allow if no flags saved yet (backward compat)
    return true;
  }
  return flags[page] === true;
}
function guardAccess(page) {
  if (page === 'access') return true;
  const flags = JSON.parse(localStorage.getItem('gv_flags') || '{}');
  // If no flags set yet, allow (first visit / master default)
  if (Object.keys(flags).length === 0) return true;
  if (flags[page] === true) return true;
  // Block access: show denied overlay and redirect link
  document.getElementById('content').innerHTML = `<div class="fade" style="padding:40px 0;text-align:center">
    <div style="font-size:3rem;opacity:.3;margin-bottom:16px">🔒</div>
    <h2 style="font-size:1.4rem;color:#fff;margin-bottom:8px">Acesso Negado</h2>
    <p style="color:var(--text-sub);font-size:.92rem">Você não tem permissão (<strong style="color:var(--accent)">${page}</strong>) configurada nas flags RBAC.</p>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a href="access-control.html" style="padding:10px 18px;border-radius:var(--r-xs);background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;font-weight:700;text-decoration:none">⚙️ Ir para Controle de Acesso</a>

    </div>
  </div>`;
  return false;
}
function renderUserBadge() {
  const master = JSON.parse(localStorage.getItem('gv_users') || '{}').master;

  const badge = document.getElementById('dataBadge');

function render() {
  const c = document.getElementById('content');
  if (!guardAccess(currentPage)) return;
  switch(currentPage) {
    case 'cockpit': renderCockpit(c); break;
    case 'rh': renderRH(c); break;
    case 'sma': renderSMA(c); break;
    case 'orc': renderORC(c); break;
    case 'med': renderMED(c); break;
    case 'rel': renderRel(c); break;
    case 'conf': renderConf(c); break;
  }
  renderUserBadge();
}

    ]}, options: { responsive:true, maintainAspectRatio:false, scales: { y: { beginAtZero: true } } }
  });
}

function editMeta(code, mod) {
  const current = document.getElementById('meta-' + code).textContent;
  const val = prompt('Nova meta para ' + code + ' (' + mod + '):', current);
  if (val !== null && val.trim() !== '') {
    document.getElementById('meta-' + code).textContent = val.trim();
    const saved = JSON.parse(localStorage.getItem('gv_metas') || '{}');
    saved[code] = val.trim();
    localStorage.setItem('gv_metas', JSON.stringify(saved));
    alert('Meta de ' + code + ' atualizada para: ' + val.trim());
  }
}

function uploadCsv(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = e.target.result;
      const lines = text.trim().split('\n');
      if (lines.length < 2) { alert('Arquivo vazio'); return; }
      const headers = lines[0].split(',').map(h => h.trim().toUpperCase().replace(/\s+/g, '_'));
      alert('Upload validado (Zod simulado): ' + file.name + ' | Colunas: ' + headers.slice(0,3).join(', '));
      input.value = '';
    } catch(err) { alert('Erro no arquivo: ' + err.message); input.value = ''; }
  };
  reader.readAsText(file);
}

function handleExcelUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById('fileUploadStatus');
  statusEl.style.color = 'var(--accent)';
  statusEl.textContent = '⏳ Lendo ' + file.name + '...';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      if (typeof XLSX === 'undefined') {
        throw new Error('Biblioteca XLSX não encontrada');
      }
      const workbook = XLSX.read(data, { type: 'array' });
      
      const tabMap = {
        rh: ['RH', 'Recursos Humanos', 'rh'],
        sma: ['SMA', 'Segurança', 'Seguranca', 'sma'],
        orcamento: ['Orcamento', 'Orçamento', 'ORCAMENTO', 'orcamento'],
        medicao: ['Medicao', 'Medição', 'MEDICAO', 'medicao', 'Boletim']
      };

      const loaded = {};

      for (const [key, names] of Object.entries(tabMap)) {
        const foundName = workbook.SheetNames.find(sn => names.some(n => sn.toLowerCase().trim() === n.toLowerCase().trim()));
        if (foundName) {
          const ws = workbook.Sheets[foundName];
          const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
          loaded[key] = json.map(row => {
            const normalized = {};
            for (const [k, v] of Object.entries(row)) {
              const normKey = normalizeHeader(k);
              let val = v;
              if (typeof val === 'string') {
                const num = parseCellNumber(val);
                val = (!isNaN(num) && val.trim() !== '') ? num : val.trim();
              } else if (typeof val === 'number') {
                val = parseCellNumber(val);
              }
              normalized[normKey] = val;
            }
            return normalized;
          });
        }
      }

      if (!loaded.rh && !loaded.sma && !loaded.orcamento && !loaded.medicao) {
        throw new Error('Nenhuma aba reconhecida (RH, SMA, Orcamento, Medicao) encontrada na planilha.');
      }

      if (loaded.rh) DATA.rh = loaded.rh;
      if (loaded.sma) DATA.sma = loaded.sma;
      if (loaded.orcamento) DATA.orcamento = loaded.orcamento;
      if (loaded.medicao) DATA.medicao = loaded.medicao;
      isSheetConnected = true;

      const totalRows = (DATA.rh.length + DATA.sma.length + DATA.orcamento.length + DATA.medicao.length);
      document.getElementById('dataBadge').innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 6px var(--green)"></span> Planilha Excel (' + file.name + ')';
      statusEl.style.color = 'var(--green)';
      statusEl.textContent = '✅ ' + totalRows + ' registros importados!';
      document.getElementById('lastUpdate').textContent = new Date().toLocaleString('pt-BR');

      localStorage.setItem('gv_custom_data', JSON.stringify(DATA));
      localStorage.setItem('gv_custom_filename', file.name);

      destroyCharts();
      render();
    } catch(err) {
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = '❌ ' + err.message;
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}
